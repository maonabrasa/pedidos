<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Mão na Brasa | Admin</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family:
                Inter,
                Arial,
                sans-serif;

            background:
                #070707;

            color: white;

            min-height: 100vh;
        }

        button,
        input,
        textarea,
        select {
            font: inherit;
        }

        button {
            cursor: pointer;
        }

        .hidden {
            display: none !important;
        }


        /* =========================
           LOGIN
        ========================= */

        #loginScreen {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            background:
                radial-gradient(
                    circle at top left,
                    rgba(255, 72, 0, .25),
                    transparent 35%
                ),
                radial-gradient(
                    circle at bottom right,
                    rgba(255, 170, 0, .12),
                    transparent 35%
                ),
                #050505;
        }


        .login {

            width: 100%;

            max-width: 420px;

            background:
                rgba(18,18,18,.96);

            border:
                1px solid
                rgba(255,255,255,.10);

            border-radius: 28px;

            padding: 35px;

            box-shadow:
                0 30px 100px
                rgba(0,0,0,.65);
        }


        .login-logo {

            width: 90px;

            height: 90px;

            object-fit: contain;

            display: block;

            margin:
                0 auto 20px;
        }


        .login h1 {

            text-align: center;

            font-size: 34px;

            margin-bottom: 7px;
        }


        .login h1 span {
            color: #ff5a00;
        }


        .login p {

            text-align: center;

            color: #999;

            margin-bottom: 28px;
        }


        .field {

            margin-bottom: 17px;
        }


        .field label {

            display: block;

            font-size: 12px;

            font-weight: 800;

            color: #aaa;

            margin-bottom: 7px;

            text-transform: uppercase;
        }


        .field input,
        .field textarea,
        .field select {

            width: 100%;

            border:
                1px solid
                rgba(255,255,255,.10);

            background: #101010;

            color: white;

            border-radius: 13px;

            padding: 13px 14px;

            outline: none;
        }


        .field textarea {

            min-height: 110px;

            resize: vertical;
        }


        .field input:focus,
        .field textarea:focus,
        .field select:focus {

            border-color:
                #ff5a00;

            box-shadow:
                0 0 0 3px
                rgba(255,90,0,.12);
        }


        .btn {

            border: none;

            border-radius: 12px;

            padding:
                12px 17px;

            font-weight: 800;

            transition: .2s;
        }


        .btn:hover {
            transform: translateY(-1px);
        }


        .btn-primary {

            background:
                linear-gradient(
                    135deg,
                    #ff4b00,
                    #ff8a00
                );

            color: #160800;
        }


        .btn-danger {

            background:
                rgba(255,40,40,.12);

            color:
                #ff7272;

            border:
                1px solid
                rgba(255,40,40,.2);
        }


        .btn-secondary {

            background:
                rgba(255,255,255,.07);

            color: white;

            border:
                1px solid
                rgba(255,255,255,.1);
        }


        .login .btn {

            width: 100%;

            padding: 15px;
        }


        #loginError {

            margin-top: 14px;

            color:
                #ff6d6d;

            text-align: center;

            font-size: 13px;
        }


        /* =========================
           APP
        ========================= */

        #app {

            display: grid;

            grid-template-columns:
                250px 1fr;

            min-height: 100vh;
        }


        .sidebar {

            background:
                #0b0b0b;

            border-right:
                1px solid
                rgba(255,255,255,.08);

            padding: 22px 16px;

            position: sticky;

            top: 0;

            height: 100vh;
        }


        .brand {

            display: flex;

            align-items: center;

            gap: 10px;

            padding: 8px;

            margin-bottom: 30px;

            font-weight: 900;
        }


        .brand img {

            width: 45px;

            height: 45px;

            object-fit: contain;

            border-radius: 10px;
        }


        .brand strong {
            color: #ff6200;
        }


        .nav {

            display: grid;

            gap: 7px;
        }


        .nav button {

            border: none;

            background: transparent;

            color: #999;

            text-align: left;

            padding: 14px;

            border-radius: 12px;

            font-weight: 800;
        }


        .nav button:hover,
        .nav button.active {

            background:
                rgba(255,90,0,.12);

            color: white;
        }


        .logout {

            position: absolute;

            left: 16px;

            right: 16px;

            bottom: 20px;
        }


        /* =========================
           MAIN
        ========================= */

        main {

            padding: 30px;

            width: 100%;

            max-width: 1500px;
        }


        .topbar {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            margin-bottom: 30px;
        }


        .topbar h1 {

            font-size: 35px;

            margin-bottom: 5px;
        }


        .topbar small {

            color: #888;
        }


        .section {
            display: none;
        }


        .section.active {
            display: block;
        }


        /* =========================
           DASHBOARD
        ========================= */

        .stats {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            margin-bottom: 22px;
        }


        .stat {

            background:
                linear-gradient(
                    180deg,
                    #151515,
                    #0d0d0d
                );

            border:
                1px solid
                rgba(255,255,255,.08);

            border-radius: 18px;

            padding: 20px;
        }


        .stat small {

            color: #888;

            text-transform: uppercase;

            font-size: 11px;

            font-weight: 800;
        }


        .stat strong {

            display: block;

            font-size: 30px;

            margin-top: 7px;

            color: #ffb43b;
        }


        /* =========================
           PANEL
        ========================= */

        .panel {

            background:
                #0d0d0d;

            border:
                1px solid
                rgba(255,255,255,.08);

            border-radius: 20px;

            padding: 22px;

            margin-bottom: 20px;
        }


        .panel-header {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            margin-bottom: 20px;
        }


        .panel-header h2 {
            font-size: 22px;
        }


        /* =========================
           PRODUCTS
        ========================= */

        .products {

            display: grid;

            gap: 10px;
        }


        .product {

            display: grid;

            grid-template-columns:
                70px 1fr auto;

            gap: 14px;

            align-items: center;

            background:
                rgba(255,255,255,.025);

            border:
                1px solid
                rgba(255,255,255,.07);

            border-radius: 14px;

            padding: 10px;
        }


        .product img {

            width: 70px;

            height: 70px;

            border-radius: 12px;

            object-fit: cover;

            background:
                #171717;
        }


        .product h3 {
            margin-bottom: 5px;
        }


        .product p {

            color: #888;

            font-size: 13px;
        }


        .price {

            color:
                #ffbd4a;

            font-weight: 900;

            white-space: nowrap;
        }


        .actions {

            display: flex;

            gap: 7px;

            flex-wrap: wrap;

            margin-top: 9px;
        }


        .small-btn {

            border:
                1px solid
                rgba(255,255,255,.1);

            background:
                rgba(255,255,255,.05);

            color: white;

            border-radius: 999px;

            padding:
                7px 11px;

            font-size: 11px;

            font-weight: 800;
        }


        .small-btn.orange {

            color:
                #ff9a55;

            background:
                rgba(255,90,0,.10);
        }


        .small-btn.red {

            color:
                #ff7373;

            background:
                rgba(255,0,0,.08);
        }


        /* =========================
           FORMS
        ========================= */

        .form-grid {

            display: grid;

            grid-template-columns:
                1fr 1fr;

            gap: 15px;
        }


        .full {
            grid-column:
                1 / -1;
        }


        .checkbox {

            display: flex;

            align-items: center;

            gap: 9px;

            color: #bbb;

            font-size: 13px;
        }


        .checkbox input {

            width: 18px;

            height: 18px;

            accent-color:
                #ff5a00;
        }


        /* =========================
           ORDERS
        ========================= */

        .orders {

            display: grid;

            gap: 12px;
        }


        .order {

            border:
                1px solid
                rgba(255,255,255,.08);

            background:
                rgba(255,255,255,.025);

            border-radius: 15px;

            padding: 17px;
        }


        .order-head {

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;
        }


        .protocol {

            color:
                #ff7100;

            font-weight: 900;

            margin-bottom: 5px;
        }


        .order small {
            color: #888;
        }


        .order-total {

            color:
                #ffbd4a;

            font-size: 18px;

            font-weight: 900;
        }


        /* =========================
           MOBILE
        ========================= */

        @media(max-width: 900px) {

            #app {
                grid-template-columns: 1fr;
            }

            .sidebar {

                position: static;

                height: auto;

                border-right: none;

                border-bottom:
                    1px solid
                    rgba(255,255,255,.08);
            }

            .nav {

                display: flex;

                overflow-x: auto;
            }

            .nav button {

                white-space: nowrap;
            }

            .logout {

                position: static;

                margin-top: 15px;

                width: 100%;
            }

            .stats {

                grid-template-columns:
                    1fr 1fr;
            }

        }


        @media(max-width: 600px) {

            main {
                padding: 18px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .product {

                grid-template-columns:
                    55px 1fr;
            }

            .product img {

                width: 55px;

                height: 55px;
            }

            .product > .price {

                grid-column:
                    2;
            }

            .topbar h1 {
                font-size: 28px;
            }

        }

    </style>

</head>


<body>


<!-- =========================================================
     LOGIN
========================================================= -->

<section id="loginScreen">

    <div class="login">

        <img
            class="login-logo"
            src="mao-na-brasa-icon-512.png"
            alt="Mão na Brasa">

        <h1>
            Mão na <span>Brasa</span>
        </h1>

        <p>
            Painel administrativo
        </p>


        <form id="loginForm">

            <div class="field">

                <label>
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="admin@maonabrasa.com.br"
                    required>

            </div>


            <div class="field">

                <label>
                    Senha
                </label>

                <input
                    id="password"
                    type="password"
                    placeholder="••••••••"
                    required>

            </div>


            <button
                class="btn btn-primary"
                type="submit">

                Entrar

            </button>


            <div id="loginError"></div>

        </form>

    </div>

</section>



<!-- =========================================================
     APP
========================================================= -->

<div
    id="app"
    class="hidden">


    <!-- SIDEBAR -->

    <aside class="sidebar">


        <div class="brand">

            <img
                src="mao-na-brasa-icon-512.png"
                alt="Logo">

            <span>
                Mão na <strong>Brasa</strong>
            </span>

        </div>


        <nav class="nav">


            <button
                class="active"
                data-section="dashboard">

                📊 Dashboard

            </button>


            <button
                data-section="products">

                🍔 Produtos

            </button>


            <button
                data-section="addons">

                ➕ Adicionais

            </button>


            <button
                data-section="orders">

                📦 Pedidos

            </button>


            <button
                data-section="settings">

                ⚙️ Configurações

            </button>


        </nav>


        <button
            id="logout"
            class="btn btn-secondary logout">

            Sair

        </button>

    </aside>



    <!-- MAIN -->

    <main>


        <div class="topbar">

            <div>

                <h1 id="pageTitle">
                    Dashboard
                </h1>

                <small id="loggedUser"></small>

            </div>


            <a
                href="index.html"
                target="_blank"
                class="btn btn-secondary">

                Ver site

            </a>

        </div>



        <!-- =================================================
             DASHBOARD
        ================================================== -->

        <section
            id="dashboard"
            class="section active">


            <div class="stats">


                <div class="stat">

                    <small>
                        Produtos
                    </small>

                    <strong id="statProducts">
                        0
                    </strong>

                </div>


                <div class="stat">

                    <small>
                        Adicionais
                    </small>

                    <strong id="statAddons">
                        0
                    </strong>

                </div>


                <div class="stat">

                    <small>
                        Pedidos
                    </small>

                    <strong id="statOrders">
                        0
                    </strong>

                </div>


                <div class="stat">

                    <small>
                        Faturamento
                    </small>

                    <strong id="statRevenue">
                        R$ 0,00
                    </strong>

                </div>


            </div>


            <div class="panel">

                <div class="panel-header">

                    <h2>
                        Últimos pedidos
                    </h2>

                    <button
                        id="refreshDashboard"
                        class="btn btn-secondary">

                        Atualizar

                    </button>

                </div>


                <div
                    id="recentOrders"
                    class="orders">

                </div>

            </div>


        </section>



        <!-- =================================================
             PRODUTOS
        ================================================== -->

        <section
            id="products"
            class="section">


            <div class="panel">


                <div class="panel-header">

                    <h2>
                        Produtos
                    </h2>


                    <button
                        id="newProduct"
                        class="btn btn-primary">

                        + Novo produto

                    </button>

                </div>


                <div
                    id="productsList"
                    class="products">

                </div>


            </div>



            <!-- FORM PRODUTO -->

            <div
                id="productFormPanel"
                class="panel hidden">


                <div class="panel-header">

                    <h2 id="productFormTitle">
                        Novo produto
                    </h2>

                </div>


                <form id="productForm">


                    <input
                        id="productId"
                        type="hidden">


                    <div class="form-grid">


                        <div class="field">

                            <label>
                                Nome
                            </label>

                            <input
                                id="productName"
                                required>

                        </div>


                        <div class="field">

                            <label>
                                Categoria
                            </label>

                            <input
                                id="productCategory"
                                placeholder="Burgers"
                                required>

                        </div>


                        <div class="field">

                            <label>
                                Tag
                            </label>

                            <input
                                id="productTag"
                                placeholder="Na brasa">

                        </div>


                        <div class="field">

                            <label>
                                Preço
                            </label>

                            <input
                                id="productPrice"
                                type="number"
                                min="0"
                                step="0.01"
                                required>

                        </div>


                        <div class="field full">

                            <label>
                                Descrição
                            </label>

                            <textarea
                                id="productDescription">
                            </textarea>

                        </div>


                        <div class="field full">

                            <label>
                                Imagem
                            </label>

                            <input
                                id="productImage"
                                placeholder="brasa.jpg">

                        </div>


                        <div class="field">

                            <label>
                                Posição da imagem
                            </label>

                            <input
                                id="productPosition"
                                value="center">

                        </div>


                        <div class="field">

                            <label>
                                Ordem
                            </label>

                            <input
                                id="productOrder"
                                type="number"
                                value="0">

                        </div>


                        <label class="checkbox">

                            <input
                                id="productAddons"
                                type="checkbox">

                            Permitir adicionais

                        </label>


                        <label class="checkbox">

                            <input
                                id="productAvailable"
                                type="checkbox"
                                checked>

                            Produto disponível

                        </label>


                    </div>


                    <div class="actions">

                        <button
                            class="btn btn-primary"
                            type="submit">

                            Salvar produto

                        </button>


                        <button
                            id="cancelProduct"
                            class="btn btn-secondary"
                            type="button">

                            Cancelar

                        </button>

                    </div>


                </form>

            </div>


        </section>



        <!-- =================================================
             ADICIONAIS
        ================================================== -->

        <section
            id="addons"
            class="section">


            <div class="panel">


                <div class="panel-header">

                    <h2>
                        Adicionais
                    </h2>


                    <button
                        id="newAddon"
                        class="btn btn-primary">

                        + Novo adicional

                    </button>

                </div>


                <div
                    id="addonsList"
                    class="products">

                </div>


            </div>


            <div
                id="addonFormPanel"
                class="panel hidden">


                <form id="addonForm">


                    <input
                        id="addonId"
                        type="hidden">


                    <div class="form-grid">


                        <div class="field">

                            <label>
                                Nome
                            </label>

                            <input
                                id="addonName"
                                required>

                        </div>


                        <div class="field">

                            <label>
                                Preço
                            </label>

                            <input
                                id="addonPrice"
                                type="number"
                                step="0.01"

                        </div>


                        <div class="field">

                            <label>
                                Ordem
                            </label>

                            <input
                                id="addonOrder"
                                type="number"
                                value="0">

                        </div>


                        <label class="checkbox">

                            <input
                                id="addonAvailable"
                                type="checkbox"
                                checked>

                            Disponível

                        </label>


                    </div>


                    <div class="actions">

                        <button
                            class="btn btn-primary">

                            Salvar adicional

                        </button>


                        <button
                            id="cancelAddon"
                            type="button"
                            class="btn btn-secondary">

                            Cancelar

                        </button>

                    </div>


                </form>

            </div>


        </section>



        <!-- =================================================
             PEDIDOS
        ================================================== -->

        <section
            id="orders"
            class="section">


            <div class="panel">


                <div class="panel-header">

                    <h2>
                        Pedidos
                    </h2>


                    <button
                        id="refreshOrders"
                        class="btn btn-secondary">

                        Atualizar

                    </button>

                </div>


                <div
                    id="ordersList"
                    class="orders">

                </div>


            </div>


        </section>



        <!-- =================================================
             CONFIGURAÇÕES
        ================================================== -->

        <section
            id="settings"
            class="section">


            <div class="panel">


                <div class="panel-header">

                    <h2>
                        Configurações do site
                    </h2>

                </div>


                <form
                    id="settingsForm">


                    <div class="form-grid">


                        <div class="field">

                            <label>
                                Nome do restaurante
                            </label>

                            <input
                                id="settingBusinessName">

                        </div>


                        <div class="field">

                            <label>
                                WhatsApp
                            </label>

                            <input
                                id="settingWhatsapp">

                        </div>


                        <div class="field">

                            <label>
                                Taxa de entrega
                            </label>

                            <input
                                id="settingDelivery"
                                type="number"
                                step="0.01">

                        </div>


                        <div class="field">

                            <label>
                                Nome da marca
                            </label>

                            <input
                                id="settingBrand">

                        </div>


                        <div class="field full">

                            <label>
                                Título principal
                            </label>

                            <textarea
                                id="settingHeroTitle">
                            </textarea>

                        </div>


                        <div class="field full">

                            <label>
                                Texto principal
                            </label>

                            <textarea
                                id="settingHeroText">
                            </textarea>

                        </div>


                    </div>


                    <button
                        class="btn btn-primary"
                        type="submit">

                        Salvar configurações

                    </button>


                </form>

            </div>


        </section>


    </main>

</div>



<script>


/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://wahqqziycgeqdnjwekze.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_x4BRaiTbBterckrZ2t5HCQ_jw69YZUn";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   VARIÁVEIS
========================================================= */

let products = [];

let addons = [];

let orders = [];


/* =========================================================
   HELPERS
========================================================= */

const $ = id =>
    document.getElementById(id);


function money(value) {

    return Number(
        value || 0
    ).toLocaleString(
        "pt-BR",
        {
            style: "currency",
            currency: "BRL"
        }
    );

}


function escapeHtml(value) {

    return String(
        value ?? ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


/* =========================================================
   LOGIN
========================================================= */

async function checkLogin() {


    const {
        data: {
            session
        }
    } =
        await supabaseClient
            .auth
            .getSession();


    if (!session) {

        showLogin();

        return;

    }


    const {
        data: admin,
        error
    } =
        await supabaseClient

            .from("mnb_admins")

            .select("*")

            .eq(
                "user_id",
                session.user.id
            )

            .eq(
                "active",
                true
            )

            .maybeSingle();


    if (
        error ||
        !admin
    ) {

        await supabaseClient
            .auth
            .signOut();


        showLogin();


        $("loginError")
            .textContent =
            "Este usuário não possui acesso ao painel.";

        return;

    }


    showApp(
        session.user
    );


    await loadAll();

}


function showLogin() {

    $("loginScreen")
        .classList
        .remove("hidden");

async function loadProducts() {


    const {
        data,
        error
    } =

function renderProducts() {

    }


    $("productsList")

window.editProduct =
async function(id) {


    const product =
        products.find(
            item =>
                item.id === id
        );


    if (!product)
        return;


    $("productId")
        .value =
        product.id;


    $("productName")
        .value =
        product.name || "";


    $("productCategory")
        .value =
        product.category || "";


    $("productTag")
        .value =
        product.tag || "";


    $("productPrice")
        .value =
        product.price || 0;


    $("productDescription")
        .value =
        product.description || "";


    $("productImage")
        .value =
        product.image || "";


    $("productPosition")
        .value =
        product.image_position ||
        "center";


    $("productOrder")
        .value =
        product.sort_order || 0;


    $("productAddons")
        .checked =
        Boolean(
            product.has_addons
        );


    $("productAvailable")
        .checked =
        Boolean(
            product.available
        );


    $("productFormTitle")
        .textContent =
        "Editar produto";


    $("productFormPanel")
        .classList
        .remove(
            "hidden"
        );


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

};


/* =========================================================
   SALVAR PRODUTO
========================================================= */

$("productForm")
    .addEventListener(
        "submit",
        async event => {


            event.preventDefault();


            const id =
                $("productId")
                    .value;


            const payload = {

                name:
                    $("productName")
                        .value
                        .trim(),

                category:
                    $("productCategory")
                        .value
                        .trim(),

                tag:
                    $("productTag")
                        .value
                        .trim(),

                description:
                    $("productDescription")
                        .value
                        .trim(),

                price:
                    Number(
                        $("productPrice")
                            .value
                    ),

                image:
                    $("productImage")
                        .value
                        .trim(),

                image_fit:
                    "contain",

                image_position:
                    $("productPosition")
                        .value
                        .trim() ||
                    "center",

                has_addons:
                    $("productAddons")
                        .checked,

                available:
                    $("productAvailable")
                        .checked,

                sort_order:
                    Number(
                        $("productOrder")
                            .value ||
                        0
                    )

            };


            let result;


            if (id) {


                result =
                    await supabaseClient

                        .from(
                            "mnb_products"
                        )

                        .update(
                            payload
                        )

                        .eq(
                            "id",
                            id
                        );


            } else {


                result =
                    await supabaseClient

                        .from(
                            "mnb_products"
                        )

                        .insert(
                            payload
                        );

            }


            if (result.error) {

                console.error(
                    result.error
                );


                alert(
                    "Erro ao salvar produto:\n" +
                    result.error.message
                );


                return;

            }


            alert(
                "Produto salvo com sucesso!"
            );


            $("productFormPanel")
                .classList
                .add(
                    "hidden"
                );


            await loadProducts();


            updateDashboard();

        }
    );

) {


    const {
        error
    } =

                "mnb_products"

            .update({
                available:
                    !current

            .eq(

    if (error) {

        );

        return;

    }


    await loadProducts();

};


/* =========================================================
   EXCLUIR PRODUTO
========================================================= */

window.deleteProduct =
async function(id) {


    const product =
        products.find(
            item =>
                item.id === id
        );


    if (!product)
        return;


    const confirmed =
        confirm(
            `Excluir "${product.name}"?`
        );


    if (!confirmed)
        return;


    const {
        error
    } =
        await supabaseClient

            .from(
                "mnb_products"
            )

            .delete()

            .eq(
                "id",
                id
            );


    if (error) {

        alert(
            "Erro ao excluir:\n" +
            error.message
        );

        return;

    }


    await loadProducts();

    updateDashboard();

};

function renderOrders() {

        return;

    }


    $("ordersList")
        .innerHTML =

            .map(order => `

                    <div class="order-head">


                        <div>

                            <div class="protocol">

                                ${escapeHtml(
                                    order.protocol
                                )}

                            </div>


                            <strong>

                                ${escapeHtml(
                                    order.customer_name
                                )}

                            </strong>


                            <br>

                                ${
                                    order.order_type ===
                                    "entrega"

                                    ? "Entrega"

                                    : "Retirada"
                                }

                                ${

                                        order.payment_method
                                    )
                                }

                        <div class="order-total">

                            ${money(
                                order.total
                            )}

                        </div>


                    </div>


                    <div class="actions">

                            class="small-btn"

                                updateOrderStatus(
                                    '${order.id}',
                                    this.value
                                )
                            ">

                            ${statusOptions(
                                order.status
                            )}

                        </select>


                    </div>


                    ${
                        order.address
                        ? `
                            <p
                                style="
                                    margin-top:10px;

                                ">

                                )}

                        `
                        : ""
                    }


                    ${
                        order.customer_note
                        ? `
                            <p
                                style="
                                    margin-top:7px;
                                    color:#aaa;
                                ">

                                📝
                                ${escapeHtml(
                                    order.customer_note
                                )}

                            </p>
                        `
                        : ""
                    }


                </div>

            `)

            .join("");

}


function statusOptions(
    current
) {


    const statuses = [

        ["novo", "Novo"],

        [
            "confirmado",
            "Confirmado"
        ],

        [
            "preparando",
            "Preparando"
        ],

        [
            "pronto",
            "Pronto"
        ],

        [
            "saiu_entrega",
            "Saiu para entrega"
        ],

        [
            "finalizado",
            "Finalizado"
        ],

        [
            "cancelado",
            "Cancelado"
        ]

    ];


    return statuses
        .map(
            ([value, label]) => `

                <option
                    value="${value}"
                    ${
                        value === current
                        ? "selected"
                        : ""
                    }>

                    ${label}

                </option>

            `
        )
        .join("");

}

/* =========================================================
   DASHBOARD
========================================================= */

function updateDashboard() {


    $("statProducts")
        .textContent =
        products.length;


    $("statAddons")
        .textContent =
        addons.length;


    $("statOrders")
        .textContent =
        orders.length;


    const revenue =
        orders

            .filter(
                order =>
                    order.status !==
                    "cancelado"
            )

            .reduce(
                (total, order) =>
                    total +
                    Number(
                        order.total || 0
                    ),
                0
            );


    $("statRevenue")
        .textContent =
        money(revenue);


    $("recentOrders")
        .innerHTML =

        orders
            .slice(0, 5)

            .map(order => `

                <div class="order">

                    <div class="order-head">

                        <div>

                            <div class="protocol">

                                ${escapeHtml(
                                    order.protocol
                                )}

                            </div>

                            <strong>

                                ${escapeHtml(
                                    order.customer_name
                                )}

                            </strong>

                        </div>


                        <div class="order-total">

                            ${money(
                                order.total
                            )}

                        </div>

                    </div>

                </div>

            `)

            .join("");

}
